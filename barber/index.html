<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Барбершоп «Ұста» — запись</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="../app.css">
<style>
  .tabs { overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 1 0 auto; padding: 0 10px; }
  @media (max-width: 360px) {
    .tab { padding: 0 7px; font-size: 13px; }
    .svc .size b { font-size: 13px; }
  }
  .tab .n {
    display: inline-grid; place-items: center; min-width: 17px; height: 17px; margin-left: 5px; border-radius: 9px;
    font-size: 11px; background: var(--acc); color: var(--acc-ink); vertical-align: 1px;
  }
  .tab.on .n { background: var(--acc-ink); color: var(--acc); }
  .hero.col { flex-direction: column; gap: 0; }
  .hero .row { display: flex; gap: 12px; }
  .hero .ph { height: 104px; }
  .svc { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
  .svc.two { grid-template-columns: repeat(2, 1fr); }
  .svc.one { grid-template-columns: 1fr; }
  .svc .size { position: relative; }
  .svc .size b { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 14px; }
  .svc .size i {
    position: absolute; top: 6px; right: 6px; width: 16px; height: 16px; border-radius: 50%;
    border: 1.5px solid var(--hint); font-style: normal; font-size: 11px; line-height: 13px; text-align: center;
  }
  .svc .size.on i { border-color: currentColor; background: var(--acc-ink); color: var(--acc); font-weight: 800; }
  .price { margin-top: auto; font-size: 15px; font-weight: 700; }
  .picked { display: flex; flex-wrap: wrap; gap: 6px; }
  .picked .chip { padding-right: 8px; }
  .picked .chip .x { font-size: 15px; opacity: .6; padding: 0 2px; }
  .picked .none { font-size: 13px; color: var(--hint); padding: 2px; }
  .av {
    width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center;
    font-size: 12px; font-weight: 700; color: #fff; margin-left: -6px;
  }
  .chip.on .av { box-shadow: 0 0 0 2px var(--acc); }
  .days { grid-template-columns: repeat(7, 1fr); }
  .times { grid-template-columns: repeat(5, 1fr); }
</style>
</head>
<body>
<div class="app">
  <div class="tabs" id="tabs"></div>
  <div class="hero col">
    <div class="row">
      <img class="ph" id="ph" alt="">
      <div class="info">
        <div class="nm" id="nm"></div>
        <div class="ds" id="ds"></div>
        <div class="price" id="pr"></div>
      </div>
    </div>
    <div class="svc" id="svc"></div>
  </div>

  <div class="lbl">Выбрано</div>
  <div class="picked" id="picked"></div>

  <div class="lbl">Барбер</div>
  <div class="chips" id="masters"></div>

  <div class="lbl">День</div>
  <div class="grid days" id="days"></div>

  <div class="lbl">Время</div>
  <div class="grid times" id="times"></div>
  <div class="note" id="note">📍 Алматы, ул. Сейфуллина, 531, вход со двора</div>

  <div class="bar"><button class="go" id="go"></button></div>
</div>
<script src="../app.js"></script>
<script>
// Каталог — тот же, что в barber/bot.py (CATALOG). Меняете цены там — поменяйте и здесь.
// [вкладка, фото, описание, [[полное название, коротко, минут, цена], ...]]
const C = [
  ["Стрижка", "haircut", "Классика, фейды, текстура. Мытьё и укладка включены",
    [["Мужская стрижка", "Стрижка", 60, 7000], ["Стрижка машинкой", "Машинкой", 30, 4000], ["Фейд", "Фейд", 60, 8000], ["Укладка", "Укладка", 15, 2000]]],
  ["Борода", "beard", "Горячее полотенце, опасная бритва, масло",
    [["Моделирование бороды", "Борода", 30, 4500], ["Королевское бритьё", "Бритьё", 45, 6000], ["Камуфляж седины", "Камуфляж", 30, 5000]]],
  ["Уход", "care", "Маски и уход за кожей — можно добавить к стрижке",
    [["Чёрная маска", "Маска", 20, 2500], ["Уход за лицом", "Кожа лица", 40, 6000], ["Воск: нос и уши", "Воск", 10, 1500], ["Массаж головы", "Массаж", 15, 2000]]],
  ["Дети", "kids", "Для мальчиков до 12 лет, с мультиками",
    [["Детская стрижка", "Детская", 45, 5000], ["Отец и сын", "Отец и сын", 90, 12000]]],
];
const M = [["Арман", [0, 1, 2]], ["Даурен", [0, 1, 2, 3]], ["Тимур", [0, 2, 3]], ["Ербол", [0, 1, 2]], ["Алихан", [1, 2]]];
const MC = ["#b5654a", "#4f7fc4", "#6a8f4f", "#8a5fb5", "#c4914f"];
const DAYS = 7, SLOTS = 10, FIRST = 11, MAX_MIN = 240;

// Занятость: «постоянные клиенты» по той же формуле, что в боте, плюс реальные записи из ссылки (?u=дата&b=...).
function fnv(s) {
  let x = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) x = Math.imul(x ^ s.charCodeAt(i), 0x01000193) >>> 0;
  x ^= x >>> 16; x = Math.imul(x, 0x85ebca6b) >>> 0; x ^= x >>> 13; x = Math.imul(x, 0xc2b2ae35) >>> 0;
  return (x ^ x >>> 16) >>> 0;
}
const q = new URLSearchParams(location.search);
const real = new Set();
if (q.get("u") && q.get("b")) {
  for (const it of q.get("b").split(",")) {
    const [off, m, t, len] = it.split(".").map(Number);
    const iso = addDays(q.get("u"), off).toISOString().slice(0, 10);
    for (let k = 0; k < len; k++) real.add(m + "|" + iso + "|" + (t + k));
  }
}
const NOW = almatyNow();
const dayIso = d => addDays(NOW.iso, d).toISOString().slice(0, 10);
function busy(m, d, t) {
  const iso = dayIso(d), key = m + "|" + iso + "|" + t;
  if (d === 0 && (FIRST + t) * 60 < NOW.mins + 60) return true;
  return (fnv(key) >>> 24) < 72 || real.has(key);
}

// Выбранные услуги: список [вкладка, номер]. Длительность и цена — сумма.
const S = { c: 0, sv: [[0, 0]], m: -1, d: -1, t: -1 };
const svc = ([c, i]) => C[c][3][i];
const has = (c, i) => S.sv.some(x => x[0] === c && x[1] === i);
const mins = () => S.sv.reduce((a, x) => a + svc(x)[2], 0);
const price = () => S.sv.reduce((a, x) => a + svc(x)[3], 0);
const len = () => Math.ceil(mins() / 60);
const canDo = j => S.sv.every(x => M[j][1].includes(x[0]));
function dur(n) { const h = Math.floor(n / 60), m = n % 60; return (h ? h + " ч" : "") + (h && m ? " " : "") + (m ? m + " мин" : ""); }
function freeMasters(m, d, t) {
  if (!S.sv.length) return [];
  const L = len(), list = m >= 0 ? [m] : M.map((x, j) => j).filter(canDo);
  return list.filter(j => t + L <= SLOTS && ![...Array(L).keys()].some(k => busy(j, d, t + k)));
}
const dayOk = d => [...Array(SLOTS).keys()].some(t => freeMasters(S.m, d, t).length);

function fix() {
  if (S.m >= 0 && !canDo(S.m)) S.m = -1;
  if (S.d < 0 || !dayOk(S.d)) { S.d = [...Array(DAYS).keys()].find(d => dayOk(d)) ?? -1; S.t = -1; }
  if (S.t >= 0 && !freeMasters(S.m, S.d, S.t).length) S.t = -1;
}

function toggle(c, i) {
  if (has(c, i)) { S.sv = S.sv.filter(x => !(x[0] === c && x[1] === i)); return; }
  if (mins() + C[c][3][i][2] > MAX_MIN) { toast("Больше 4 часов за один визит не записываем"); return; }
  S.sv.push([c, i]);
}

function render() {
  fix();
  const cat = C[S.c];
  const tabs = document.getElementById("tabs"); tabs.innerHTML = "";
  C.forEach((x, j) => {
    const n = S.sv.filter(v => v[0] === j).length;
    const b = h("button", "tab" + (j === S.c ? " on" : ""), x[0] + (n ? '<span class="n">' + n + "</span>" : ""));
    b.onclick = () => { if (S.c !== j) { S.c = j; tick(); render(); } };
    tabs.appendChild(b);
  });
  document.getElementById("ph").src = "img/" + cat[1] + ".jpg";
  document.getElementById("nm").textContent = cat[0];
  document.getElementById("ds").textContent = cat[2];
  document.getElementById("pr").innerHTML = S.sv.length
    ? rub(price()) + ' <span class="ds">· ' + dur(mins()) + "</span>"
    : '<span class="ds">Выберите одну или несколько услуг</span>';

  const sv = document.getElementById("svc"); sv.innerHTML = "";
  const n = cat[3].length;
  sv.className = "svc" + (n === 1 ? " one" : n === 2 || n === 4 ? " two" : "");
  cat[3].forEach((x, j) => {
    const on = has(S.c, j);
    const b = h("button", "size" + (on ? " on" : ""), "<i>" + (on ? "✓" : "") + "</i><b>" + x[1] + "</b><small>" + rub(x[3]) + " · " + x[2] + " мин</small>");
    b.setAttribute("aria-pressed", on);
    b.onclick = () => { toggle(S.c, j); tick(); render(); };
    sv.appendChild(b);
  });

  const pk = document.getElementById("picked"); pk.innerHTML = "";
  if (!S.sv.length) pk.appendChild(h("div", "none", "Пока ничего. Можно выбрать несколько услуг из разных вкладок."));
  S.sv.forEach(x => {
    const b = h("button", "chip on", svc(x)[0] + ' <span class="x">✕</span>');
    b.setAttribute("aria-label", "Убрать " + svc(x)[0]);
    b.onclick = () => { toggle(x[0], x[1]); tick(); render(); };
    pk.appendChild(b);
  });

  const ms = document.getElementById("masters"); ms.innerHTML = "";
  const able = M.map((x, j) => j).filter(canDo);
  if (S.sv.length && !able.length) {
    ms.appendChild(h("div", "none note", "Никто из барберов не делает всё это за один визит. Уберите что-нибудь или запишитесь дважды."));
  } else {
    const any = h("button", "chip" + (S.m < 0 ? " on" : ""), '<span class="em">✨</span>Любой');
    any.onclick = () => { S.m = -1; tick(); render(); };
    ms.appendChild(any);
    able.forEach(j => {
      const b = h("button", "chip" + (j === S.m ? " on" : ""),
        '<span class="av" style="background:' + MC[j] + '">' + M[j][0][0] + "</span>" + M[j][0]);
      b.onclick = () => { S.m = j; tick(); render(); };
      ms.appendChild(b);
    });
  }

  const ds = document.getElementById("days"); ds.innerHTML = "";
  for (let d = 0; d < DAYS; d++) {
    const dt = addDays(NOW.iso, d);
    const b = h("button", "day" + (d === S.d ? " on" : "") + (dayOk(d) ? "" : " off"),
      "<small>" + (d === 0 ? "сег" : WD[dt.getUTCDay()]) + "</small><b>" + dt.getUTCDate() + "</b>");
    b.onclick = () => { S.d = d; S.t = -1; tick(); render(); };
    ds.appendChild(b);
  }

  const ts = document.getElementById("times"); ts.innerHTML = "";
  for (let t = 0; t < SLOTS; t++) {
    const ok = S.d >= 0 && freeMasters(S.m, S.d, t).length;
    const b = h("button", "chip" + (t === S.t ? " on" : "") + (ok ? "" : " off"), (FIRST + t) + ":00");
    b.onclick = () => { S.t = t; tick(); render(); };
    ts.appendChild(b);
  }

  const go = document.getElementById("go");
  const ready = S.sv.length && S.t >= 0;
  go.className = "go" + (ready ? "" : " wait");
  go.textContent = !S.sv.length ? "Выберите услугу" : S.t < 0 ? "Выберите время" : "Записаться · " + rub(price());
}

document.getElementById("go").onclick = () => {
  if (!S.sv.length) { toast("Выберите хотя бы одну услугу"); return; }
  if (S.t < 0) { toast(S.d < 0 ? "На ближайшую неделю мест нет" : "Выберите время"); return; }
  sendToBot({ s: S.sv, m: S.m, d: dayIso(S.d), t: S.t });
};
initApp();
render();
</script>
</body>
</html>
